sqlalchemy.url = postgresql://trading_user:trading_password@localhost:5432/trading_db
sqlalchemy.echo = false
sqlalchemy.echo_pool = false
sqlalchemy.pool_pre_ping = true
sqlalchemy.pool_size = 10
sqlalchemy.max_overflow = 20

script_location = migrations

sqlalchemy.track_modifications = false

version_location_template = migrations/versions/%%(rev)s_%%(slug)s.py
version_filename_template = %%(rev)s_%%(slug)s.py

migration_file_template = """\"\"\"%(rev)s_%(message)s

Revision ID: %(rev)s
Revises: %(down_revision)s
Create Date: %(create_date)s

\"\"\"

from alembic import op
import sqlalchemy as sa
%(imports)s

# revision identifiers, used by Alembic.
revision = '%(rev)s'
down_revision = %(down_revision)r
branch_labels = %(branch_labels)r
depends_on = %(depends_on)r


def upgrade() -> None:
    %(upgrades)s


def downgrade() -> None:
    %(downgrades)s
"""
